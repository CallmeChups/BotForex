id: multi_flappy_bird
name: Multi Flappy Bird BUY/SELL
version: "1.0"
description: |
  Independent clone of Flappy Bird BUY/SELL. It currently uses the same
  configurable EMA groups, mother/children/father pattern, and limit-order
  behavior so future Multi Flappy Bird changes remain isolated.
author: admin
created: "2026-09-14"
enabled: true

entry:
  type: pattern
  timeframe: M1
  higher_timeframe: M5
  higher_timeframe_filter_enabled: true
  pattern: multi_flappy_bird
  ema_consensus:
    short: 13
    medium: 21
    long: 55
  ema_fallback:
    short: 13
    medium: 21
    long: 55
  ema_consensus_enabled: true
  ema_fallback_enabled: true
  current_timeframe_filter_enabled: true
  higher_ema_consensus:
    short: 13
    medium: 21
    long: 55
  higher_ema_fallback:
    short: 13
    medium: 21
    long: 55
  higher_ema_consensus_enabled: true
  higher_ema_fallback_enabled: true

exit:
  tp:
    type: price_based
  sl:
    type: price_based
  time_limit:
    enabled: false
    max_candles: 0

parameters:
  use_mother_candle: true
  no_mother_child_candles: 2
  no_mother_child_body_ratio: 1.5
  no_mother_child_body_max_points: 1.5
  no_mother_father_wick_max_pct: 40.0
  no_mother_cross_window_candles: 15
  no_mother_sl_buffer_pips: 5.0
  entry_body_percent: 5.0
  sl_buffer_pips: 5.0
  rr_ratio: 2.0
  min_father_body_points: 2.0
  max_child_body_points: 2.0
  cross_window_candles: 12
  min_child_candles: 2
  max_child_candles: 5
  max_child_body_points: 2.0
  mother_coverage_enabled: true
  lot_size: 0.01
  limit_order_candles: 7
  magic: 212401

symbols:
  - XAUUSDm
  - XAUUSD
